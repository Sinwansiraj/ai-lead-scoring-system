services:
  - type: web
    name: ai-lead-scoring-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free

    envVars:
      - key: PYTHONPATH
        value: /app/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      # CORS: the deployed Vercel frontend origin allowed to call this API
      - key: ALLOWED_ORIGINS
        value: https://ai-lead-scoring-system.vercel.app
      # Per-IP request cap per minute on the scoring endpoints
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

    healthCheckPath: /api/v1/health
